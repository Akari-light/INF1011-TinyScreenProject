<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TraceHub BadUSB Upload</title>
</head>
<body>
    <main>
        <h1>TraceHub BadUSB Upload</h1>
        {% if loot_id %}
        <p>Saved loot <code>{{ loot_id }}</code>.</p>
        <p><a href="{{ url_for('badusb_upload.show_badusb_upload') }}">Open a new upload form</a></p>
        {% else %}
        <p>Upload <code>hello-world.txt</code> containing <code>hello world</code>.</p>
        <form method="post" enctype="multipart/form-data"
              action="{{ url_for('badusb_upload.receive_badusb_upload') }}">
            <input type="hidden" name="submission_id" value="{{ submission_id }}">
            <label for="demo-file">Demo file</label>
            <input id="demo-file" type="file" name="file" accept=".txt" required>
            <button type="submit">Upload demo file</button>
        </form>
        {% endif %}
    </main>
</body>
</html>
