<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TraceHub BadUSB Upload</title>
</head>
<body>
    <main>
        <h1>TraceHub BadUSB Upload</h1>
        {% if loot_id %}
        <p>Saved loot <code>{{ loot_id }}</code>.</p>
        <p><a href="{{ url_for('badusb_upload.show_badusb_upload') }}">Open a new upload form</a></p>
        {% else %}
        <p>Select <code>Test_Important.zip</code> to upload the prepared dummy files.</p>
        <form method="post" enctype="multipart/form-data"
              action="{{ url_for('badusb_upload.receive_badusb_upload') }}">
            <input type="hidden" name="submission_id" value="{{ submission_id }}">
            <label for="demo-archive">Demo ZIP</label>
            <input id="demo-archive" type="file" name="file" accept=".zip" autofocus required>
            <button type="submit">Upload ZIP</button>
        </form>
        <script>
            const archiveInput = document.getElementById("demo-archive");
            archiveInput.addEventListener("change", () => {
                if (archiveInput.files[0]?.name === "Test_Important.zip") {
                    archiveInput.form.requestSubmit();
                }
            });
        </script>
        {% endif %}
    </main>
</body>
</html>
